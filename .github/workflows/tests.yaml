---
name: Tests

on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      # fetch-depth: 0 - hatch-vcs derives the version from the git history
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          cache-dependency-glob: "pyproject.toml"

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (Plone 6.2 constraints)
        run: |
          uv venv --python ${{ matrix.python-version }}
          uv pip install -c https://dist.plone.org/release/6.2-latest/constraints.txt -e ".[test]" zope.testrunner

      - name: Run tests
        run: uv run zope-testrunner --all --test-path src
