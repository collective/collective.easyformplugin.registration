---
# NOTE: the workflow name "CI" is load-bearing - release.yaml triggers its
# Test-PyPI upload via workflow_run on this exact name.
name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  qa:
    uses: "./.github/workflows/qa.yaml"

  tests:
    uses: "./.github/workflows/tests.yaml"
